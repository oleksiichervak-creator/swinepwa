name: Check server storage and memory
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Read disk and memory usage
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh "$SSH_USER@$SSH_HOST" 'df -h / /opt/swine-pwa; free -h; docker system df'
