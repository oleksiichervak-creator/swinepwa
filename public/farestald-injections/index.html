<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#245c43"><meta name="description" content="Plan and register Farestald sow injections">
  <link rel="manifest" href="/farestald-injections/manifest.json"><link rel="icon" href="/farestald-injections/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/farestald-injections/styles.css"><title>Farestald Injections</title>
</head><body><main>
  <section id="login-view" class="view login-view">
    <div class="brand">FI</div><p class="eyebrow">FARESTALD</p><h1>Farestald Injections</h1><p class="intro">Plan and register treatments in Farestald.</p>
    <form id="login-form" class="panel"><label>User<select id="login-user" required><option value="">Loading users...</option></select></label><label>Password<input id="login-password" type="password" inputmode="numeric" autocomplete="current-password" required></label><p id="login-error" class="error" role="alert"></p><button type="submit">Sign in</button></form>
  </section>
  <section id="app-view" class="view" hidden>
    <header><button id="back" type="button" class="icon-button" aria-label="Back" hidden>&larr;</button><div><h1 id="title">Farestald</h1></div><button id="logout" type="button" class="text-button">Sign out</button></header>
    <section id="home-screen" class="screen"><p class="welcome">Signed in as <strong id="current-user"></strong></p><div class="choice-grid">
      <button id="show-add" type="button" class="choice-card"><span class="choice-icon">+</span><span><strong>Add injection</strong><small>Plan a Farestald treatment</small></span></button>
      <button id="show-today" type="button" class="choice-card accent"><span class="choice-count">FI</span><span><strong>Injections for today</strong><small>Register completed injections</small></span></button>
    </div></section>
    <section id="add-screen" class="screen" hidden><form id="add-form" class="panel form-panel">
      <label>Sow number<input name="sow_number" maxlength="100" required inputmode="numeric" autocomplete="off"></label>
      <label>Pen<select name="pen_id" required></select></label>
      <label>Medicine<select name="medicine_sow_id" required></select></label>
      <label>Weight (kg)<select name="weight_kg" required></select></label>
      <label>Start date<input name="injection_date" type="date" required></label>
      <div id="dose-preview" class="medicine" aria-live="polite"></div>
      <label>Comment<textarea name="comment" rows="3" maxlength="4000"></textarea></label>
      <p id="add-error" class="error" role="alert"></p><button id="save-plan" type="submit">Add injection</button>
    </form></section>
    <section id="today-screen" class="screen" hidden><div class="date-row"><p id="today-date" class="welcome"></p><button id="refresh" type="button" class="secondary">Refresh</button></div><p id="today-error" class="error" role="alert"></p><div id="today-list" class="injection-list" aria-live="polite"></div></section>
  </section>
</main>
<dialog id="complete-dialog"><form id="complete-form"><button id="complete-close" class="dialog-close" type="button" aria-label="Close">&times;</button><p class="eyebrow">FARESTALD</p><h2>Register injection</h2><dl id="complete-details"></dl><input name="id" type="hidden"><label>Completed on<input name="injection_date" type="date" required></label><label>Dose (ml)<input name="dose_ml" type="number" min="0" step="0.001" required inputmode="decimal"></label><label>Comment<textarea name="comment" rows="3" maxlength="4000"></textarea></label><p id="complete-error" class="error" role="alert"></p><button type="submit">Confirm injection</button></form></dialog>
<dialog id="install-dialog"><form method="dialog"><p class="eyebrow">FARESTALD</p><h2>Install Farestald Injections</h2><p id="install-message">Install this app for quick access.</p><button type="button" id="install">Install app</button><button type="submit" class="secondary">Not now</button></form></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="/farestald-injections/app.js"></script></body></html>
